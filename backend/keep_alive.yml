name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (well under the 12-hour sleep threshold)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app to keep it awake
        run: |
          curl -sSL "https://heartdiseasepredictionmodelmosalah55.streamlit.app" \
            -H "User-Agent: Mozilla/5.0 (KeepAlive Bot)" \
            --max-time 30 \
            -o /dev/null \
            -w "HTTP Status: %{http_code}\n"
